apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    namespace "com.bravebrand.posprinter"
    compileSdkVersion safeExtGet('compileSdkVersion', 36)
    buildToolsVersion safeExtGet('buildToolsVersion', '36.0.0')

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 24)
        targetSdkVersion safeExtGet('targetSdkVersion', 36)
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'com.facebook.react:react-android'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.0'

    // Epson ePOS SDK for Android — vendored locally because Epson does
    // not publish to Maven Central or any public Maven repository.
    // Download the SDK from https://support.epson.net/terms/pos/swinfo.php?id=7010
    // (EULA-gated), extract ePOS2.jar to libs/ and the libepos2.so files
    // to src/main/jniLibs/<abi>/.
    //
    // History: previously used Star's StarPRNT/StarXpand SDKs (TSP143IIIU
    // hardware) — printer was swapped to Epson TM-T82X (M352/M352A).
    implementation files('libs/ePOS2.jar')
}
