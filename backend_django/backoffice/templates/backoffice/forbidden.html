{% extends "backoffice/base.html" %}

{% block title %}Not permitted — Bravepos{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body text-center py-5">
    <i class="bi bi-shield-lock text-secondary" style="font-size:3rem;"></i>
    <h4 class="mt-3 mb-2">Admins only</h4>
    <p class="text-muted mb-4">
      User management and the audit log are limited to accounts with the
      <strong>Admin</strong> role. You're signed in as
      <strong>{{ user.get_username }}</strong>.
    </p>
    <a class="btn btn-outline-secondary" href="{% url 'backoffice:dashboard' %}">
      <i class="bi bi-arrow-left"></i> Back to dashboard
    </a>
  </div>
</div>
{% endblock %}
