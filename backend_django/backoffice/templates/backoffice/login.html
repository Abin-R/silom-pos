<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Bravepos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(180deg, #2c3e50 0%, #1f2d3d 100%); min-height: 100vh; }
    .login-card { max-width: 420px; margin: 6rem auto; border: 0; border-radius: 14px;
                  box-shadow: 0 18px 60px rgba(0,0,0,0.25); }
    .login-card .brand { font-weight: 700; font-size: 1.75rem; letter-spacing: -0.02em; }
    .login-card .brand .dot { color: #00B14F; }
    .btn-success { background: #00B14F; border-color: #00B14F; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card login-card">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="brand">Bravepos<span class="dot">.</span></div>
          <div class="text-muted small">Backoffice sign-in</div>
        </div>

        {% if form.non_field_errors %}
          <div class="alert alert-danger py-2 small">
            {{ form.non_field_errors|join:" " }}
          </div>
        {% endif %}

        <form method="post" action="{% url 'backoffice:login' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="username" class="form-control" autofocus required
                   autocomplete="username"
                   value="{{ form.username.value|default:'' }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-success w-100">
            <i class="bi bi-box-arrow-in-right"></i> Sign in
          </button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
