<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receipt #{{ order_number }} — The Rolling Pinn</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-pink: #ffacef;
      --brand-red: #d61222;
      --brand-red-dark: #a40d1a;
      --on-pink-soft: rgba(0, 0, 0, 0.55);
    }
    body {
      background: var(--brand-pink);
      min-height: 100vh;
      font-family: "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .receipt-card {
      max-width: 480px;
      margin: 2rem auto;
      border: 0;
      border-radius: 22px;
      background: #ffffff;
      box-shadow: 0 14px 48px rgba(164, 13, 26, 0.15);
    }
    /* Hand-script brand mark.  "The" small + slanted, "Rolling" inline
       above "Pinn", "Pinn" oversized in brand red — mirroring the
       layered look of the colourful kiss-mark logo. */
    .logo {
      position: relative;
      display: inline-block;
      margin: 0.25rem auto 0.75rem;
      line-height: 1;
      text-align: center;
    }
    .logo .the {
      font-family: "Pacifico", cursive;
      color: #ffffff;
      text-shadow: 0 2px 0 var(--brand-pink), 0 0 14px rgba(255, 255, 255, 0.6);
      font-size: 1.4rem;
      transform: rotate(-12deg);
      display: inline-block;
      position: absolute;
      top: -0.4rem;
      left: -0.3rem;
    }
    .logo .rolling {
      font-family: "Pacifico", cursive;
      color: #ffffff;
      text-shadow: 0 2px 0 var(--brand-pink);
      font-size: 2.2rem;
      transform: rotate(-6deg);
      display: block;
    }
    .logo .pinn {
      font-family: "Pacifico", cursive;
      color: var(--brand-red);
      font-size: 4rem;
      letter-spacing: -0.02em;
      display: block;
      margin-top: -0.5rem;
    }
    .logo .by {
      font-family: "Pacifico", cursive;
      color: var(--brand-red);
      font-size: 0.95rem;
      transform: rotate(-8deg);
      display: inline-block;
      margin-top: -0.4rem;
    }
    .order-ref {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85rem;
      color: var(--on-pink-soft);
      letter-spacing: 0.05em;
    }
    .action-btn {
      padding: 1rem 1.25rem;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      background: var(--brand-red);
      border: 0;
      color: #ffffff;
      transition: transform 0.08s ease, background 0.15s ease;
    }
    .action-btn:hover, .action-btn:focus, .action-btn:active {
      background: var(--brand-red-dark);
      color: #ffffff;
    }
    .action-btn:active { transform: scale(0.985); }
    .action-btn .bi {
      font-size: 1.5rem;
      flex-shrink: 0;
    }
    .action-btn .labels {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }
    .action-btn .labels small {
      font-weight: 400;
      opacity: 0.9;
    }
    .footnote {
      font-size: 0.82rem;
      color: var(--on-pink-soft);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card receipt-card">
      <div class="card-body p-4 p-md-5 text-center">
        <div class="logo">
          <span class="the">The</span>
          <span class="rolling">Rolling</span>
          <span class="pinn">Pinn</span>
          <span class="by">by Pinnjan</span>
        </div>
        <div class="order-ref mb-4">Receipt #{{ order_number }}</div>

        <div class="d-grid gap-3">
          <a href="{% url 'create_tax_invoice' order_number=order_number %}"
             class="btn action-btn">
            <i class="bi bi-file-earmark-text"></i>
            <span class="labels">
              <span>ออกใบกำกับภาษีเต็มรูป</span>
              <small>Issue Full Tax Invoice</small>
            </span>
          </a>
          <a href="https://rollingpinn.formaloo.me/zg8zkq?oid={{ order_number }}"
             target="_blank" rel="noopener"
             class="btn action-btn">
            <i class="bi bi-star"></i>
            <span class="labels">
              <span>รีวิวร้านค้า</span>
              <small>Leave a Review</small>
            </span>
          </a>
        </div>

        <div class="mt-4 footnote">
          ขอบคุณที่ใช้บริการ · Thank you for visiting
        </div>
      </div>
    </div>
  </div>
</body>
</html>
