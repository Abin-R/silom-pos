<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receipt #{{ order_number }} — The Rolling Pinn</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-pink: #ffacef;
      --brand-red: #d61222;
      --brand-red-dark: #a40d1a;
      --on-pink-soft: rgba(0, 0, 0, 0.55);
    }
    body {
      background: var(--brand-pink);
      min-height: 100vh;
      font-family: "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .receipt-card {
      max-width: 480px;
      margin: 2rem auto;
      border: 0;
      border-radius: 22px;
      background: #ffffff;
      box-shadow: 0 14px 48px rgba(164, 13, 26, 0.15);
    }
    /* Plain wordmark — the colourful "kiss-mark" PNG isn't in the repo,
       so we drop the fake CSS logo and just lock the shop name in
       brand red.  Honest and on-brand. */
    .brand {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--brand-red);
      letter-spacing: -0.01em;
      margin: 0.25rem 0 0.5rem;
    }
    .order-ref {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85rem;
      color: var(--on-pink-soft);
      letter-spacing: 0.05em;
    }
    .action-btn {
      padding: 1rem 1.25rem;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      background: var(--brand-red);
      border: 0;
      color: #ffffff;
      transition: transform 0.08s ease, background 0.15s ease;
    }
    .action-btn:hover, .action-btn:focus, .action-btn:active {
      background: var(--brand-red-dark);
      color: #ffffff;
    }
    .action-btn:active { transform: scale(0.985); }
    .action-btn .bi {
      font-size: 1.5rem;
      flex-shrink: 0;
    }
    .action-btn .labels {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }
    .action-btn .labels small {
      font-weight: 400;
      opacity: 0.9;
    }
    .footnote {
      font-size: 0.82rem;
      color: var(--on-pink-soft);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card receipt-card">
      <div class="card-body p-4 p-md-5 text-center">
        <div class="brand">The Rolling Pinn</div>
        <div class="order-ref mb-4">Receipt #{{ order_number }}</div>

        <div class="d-grid gap-3">
          <a href="{% url 'create_tax_invoice' order_number=order_number %}"
             class="btn action-btn">
            <i class="bi bi-file-earmark-text"></i>
            <span class="labels">
              <span>ออกใบกำกับภาษีเต็มรูป</span>
              <small>Issue Full Tax Invoice</small>
            </span>
          </a>
          <a href="{{ feedback_url }}"
             target="_blank" rel="noopener"
             class="btn action-btn">
            <i class="bi bi-star"></i>
            <span class="labels">
              <span>รีวิวร้านค้า</span>
              <small>Leave a Review</small>
            </span>
          </a>
        </div>

        <div class="mt-4 footnote">
          ขอบคุณที่ใช้บริการ · Thank you for visiting
        </div>
      </div>
    </div>
  </div>
</body>
</html>
