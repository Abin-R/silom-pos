<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receipt #{{ order_number }} — The Rolling Pinn</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(180deg, #fff7f9 0%, #ffe6ee 100%);
      min-height: 100vh;
      font-family: "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .receipt-card {
      max-width: 480px;
      margin: 2rem auto;
      border: 0;
      border-radius: 20px;
      box-shadow: 0 12px 48px rgba(214, 51, 108, 0.12);
    }
    .brand {
      font-size: 1.75rem;
      font-weight: 700;
      color: #d6336c;
      letter-spacing: -0.01em;
    }
    .order-ref {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85rem;
      color: #888;
      letter-spacing: 0.05em;
    }
    .action-btn {
      padding: 1rem 1.25rem;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      transition: transform 0.08s ease, box-shadow 0.15s ease;
    }
    .action-btn:active { transform: scale(0.985); }
    .action-btn .bi {
      font-size: 1.5rem;
      flex-shrink: 0;
    }
    .action-btn .labels {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }
    .action-btn .labels small {
      font-weight: 400;
      opacity: 0.85;
    }
    .btn-tax {
      background: #d6336c;
      border-color: #d6336c;
      color: #fff;
    }
    .btn-tax:hover, .btn-tax:focus {
      background: #b02753;
      border-color: #b02753;
      color: #fff;
    }
    .btn-review {
      background: #fff;
      border: 2px solid #d6336c;
      color: #d6336c;
    }
    .btn-review:hover, .btn-review:focus {
      background: #fff7f9;
      color: #b02753;
    }
    .footnote {
      font-size: 0.82rem;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card receipt-card">
      <div class="card-body p-4 p-md-5 text-center">
        <div class="brand mb-1">The Rolling Pinn</div>
        <div class="order-ref mb-4">Receipt #{{ order_number }}</div>

        <div class="d-grid gap-3">
          <a href="https://shopster.ai/en/app/peak/create-receipt/{{ order_number }}/?event_id=lpqutq4chcnqchop0mv7dfjpv0&platform=silompos&branch_id=Nsoayr4MBh1xbBJBOjOH"
             target="_blank" rel="noopener"
             class="btn action-btn btn-tax">
            <i class="bi bi-file-earmark-text"></i>
            <span class="labels">
              <span>ออกใบกำกับภาษีเต็มรูป</span>
              <small>Issue Full Tax Invoice</small>
            </span>
          </a>
          <a href="https://rollingpinn.formaloo.me/zg8zkq?oid={{ order_number }}"
             target="_blank" rel="noopener"
             class="btn action-btn btn-review">
            <i class="bi bi-star"></i>
            <span class="labels">
              <span>รีวิวร้านค้า</span>
              <small>Leave a Review</small>
            </span>
          </a>
        </div>

        <div class="mt-4 footnote">
          ขอบคุณที่ใช้บริการ · Thank you for visiting
        </div>
      </div>
    </div>
  </div>
</body>
</html>
