<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create peak receipt for {{ order_number }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: #f3f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      margin: 0;
    }
    /* Sticky teal page header — matches the reference mockup. */
    .page-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #2cae87;
      color: #ffffff;
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.06);
    }
    .page-header h1 {
      font-size: 1.05rem;
      font-weight: 600;
      margin: 0;
      letter-spacing: 0;
    }
    .page-header .save-btn {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      background: #ffffff;
      color: #2cae87;
      border: 0;
      border-radius: 6px;
      padding: 0.4rem 1rem;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .page-header .save-btn:hover { background: #f3f4f5; }

    /* Each form row: gray label band above a white input row, edge-to-edge. */
    .form-row {
      border-bottom: 1px solid #e5e7e8;
    }
    .form-row .label {
      background: #f3f4f5;
      color: #5b6770;
      font-size: 0.78rem;
      padding: 0.45rem 1.25rem 0.35rem;
    }
    .form-row .field {
      background: #ffffff;
      padding: 0.55rem 1.25rem 0.7rem;
    }
    .form-row .field input,
    .form-row .field select,
    .form-row .field textarea {
      width: 100%;
      border: 0;
      outline: 0;
      box-shadow: none;
      padding: 0;
      font-size: 0.95rem;
      color: #2b2f33;
      background: transparent;
    }
    .form-row .field input::placeholder,
    .form-row .field textarea::placeholder {
      color: #c4c9cd;
    }
    /* Subtle teal underline on the focused row, like the reference. */
    .form-row.focused {
      box-shadow: inset 0 -2px 0 #2cae87;
    }
    /* Native select arrow on the right — kept as a plain native control. */
    .form-row .field select {
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' fill='none' stroke='%235b6770' stroke-width='1.5' stroke-linecap='round'/></svg>");
      background-repeat: no-repeat;
      background-position: right 0 center;
      background-size: 14px;
      padding-right: 22px;
    }
  </style>
</head>
<body>
  <form method="post" action="{% url 'save_tax_invoice' order_number=order_number %}" id="tax-invoice-form">
    {% csrf_token %}
    <header class="page-header">
      <h1>Create peak receipt for {{ order_number }}</h1>
      <button type="submit" class="save-btn">Save</button>
    </header>

    <div class="form-row">
      <div class="label">Name</div>
      <div class="field"><input type="text" name="name" placeholder="Name" required></div>
    </div>

    <div class="form-row">
      <div class="label">Tax ID</div>
      <div class="field"><input type="text" name="tax_id" placeholder="Tax ID" required></div>
    </div>

    <div class="form-row">
      <div class="label">Customer Type</div>
      <div class="field">
        <select name="customer_type">
          <option value="">---------</option>
          <option>Individual</option>
          <option>Company</option>
        </select>
      </div>
    </div>

    <div class="form-row focused">
      <div class="label">Registered Address</div>
      <div class="field"><input type="text" name="registered_address"></div>
    </div>

    <div class="form-row">
      <div class="label">Registered Country</div>
      <div class="field">
        <select name="registered_country">
          <option>Thailand</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="label">Registered Province</div>
      <div class="field"><input type="text" name="registered_province" placeholder="Registered Province"></div>
    </div>

    <div class="form-row">
      <div class="label">Registered City</div>
      <div class="field"><input type="text" name="registered_city" placeholder="Registered City"></div>
    </div>

    <div class="form-row">
      <div class="label">Registered District</div>
      <div class="field"><input type="text" name="registered_district" placeholder="Registered District"></div>
    </div>

    <div class="form-row">
      <div class="label">Registered Postal Code</div>
      <div class="field"><input type="text" name="registered_postal_code" placeholder="Registered Postal Code"></div>
    </div>
  </form>
</body>
</html>
